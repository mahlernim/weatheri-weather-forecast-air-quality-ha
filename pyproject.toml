[project]
name = "weatheri-weather-forecast-air-quality-ha"
version = "0.2.2"
requires-python = ">=3.14.2"
dependencies = ["beautifulsoup4==4.13.3"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component==0.13.317",
  "aiohttp",
  "ruff>=0.9",
  "pillow>=11.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components/weatheri_forecast"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"custom_components.weatheri_forecast" = ["*.json", "translations/*.json", "brand/*.png"]

[tool.ruff]
line-length = 100
target-version = "py313"
